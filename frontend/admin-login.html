<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart City</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdfb',
                            100: '#ccfbf1',
                            500: '#0f766e',
                            600: '#115e59',
                            700: '#0f4c46'
                        }
                    },
                    fontFamily: {
                        display: ['"Space Grotesk"', 'sans-serif'],
                        sans: ['"IBM Plex Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-border {
            position: relative;
        }
        .shimmer-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1.25rem;
            background: linear-gradient(90deg, transparent, rgba(14, 165, 233, 0.3), rgba(15, 118, 110, 0.3), transparent);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
            z-index: -1;
        }
        .login-glow {
            box-shadow: 
                0 0 60px rgba(14, 165, 233, 0.08),
                0 25px 50px rgba(15, 23, 42, 0.12);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }
        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 100%
            );
            transform: rotate(25deg);
            transition: transform 0.6s;
        }
        .btn-shine:hover::after {
            transform: rotate(25deg) translateX(100%);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeInUp 0.6s ease-out both;
        }
        .animate-in-delay {
            animation: fadeInUp 0.6s ease-out 0.15s both;
        }
    </style>
</head>
<body class="text-slate-900 font-sans antialiased">
    <div class="min-h-screen bg-aurora relative overflow-hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-grid opacity-30 pointer-events-none"></div>
        
        <!-- Decorative floating elements -->
        <div class="absolute top-20 left-10 w-72 h-72 bg-sky-200/20 rounded-full blur-3xl floaty"></div>
        <div class="absolute bottom-20 right-10 w-96 h-96 bg-teal-200/20 rounded-full blur-3xl floaty" style="animation-delay: -4s;"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-orange-100/10 rounded-full blur-3xl"></div>

        <div class="w-full max-w-md relative z-10">
            <!-- Back to Home -->
            <a href="index.html" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-sky-600 transition mb-8 group animate-in">
                <svg class="h-4 w-4 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Back to Home
            </a>

            <!-- Login Card -->
            <div class="shimmer-border animate-in-delay">
                <div class="glass rounded-2xl p-8 sm:p-10 login-glow">
                    <!-- Header -->
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-500 to-teal-600 shadow-lg shadow-sky-500/30 mb-5">
                            <svg class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <h1 class="font-display text-2xl font-bold text-slate-900">Admin Access</h1>
                        <p class="text-slate-500 text-sm mt-2">Sign in with your admin credentials</p>
                    </div>

                    <!-- Error Message -->
                    <div id="loginError" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-3">
                        <svg class="h-5 w-5 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span id="loginErrorText">Invalid email or password.</span>
                    </div>

                    <!-- Login Form -->
                    <form id="loginForm" class="space-y-5">
                        <div>
                            <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                                    </svg>
                                </div>
                                <input 
                                    type="email" 
                                    id="email" 
                                    required
                                    placeholder="admin@smartcity.com"
                                    class="input-focus w-full pl-12 pr-4 py-3.5 rounded-xl border border-slate-200 bg-white/80 text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:border-sky-400 transition"
                                >
                            </div>
                        </div>

                        <div>
                            <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                    </svg>
                                </div>
                                <input 
                                    type="password" 
                                    id="password" 
                                    required
                                    placeholder="Enter your password"
                                    class="input-focus w-full pl-12 pr-12 py-3.5 rounded-xl border border-slate-200 bg-white/80 text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:border-sky-400 transition"
                                >
                                <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition">
                                    <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button 
                            type="submit" 
                            id="loginBtn"
                            class="btn-shine w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-sky-600 to-teal-600 text-white font-semibold text-sm shadow-lg shadow-sky-500/25 hover:shadow-sky-500/40 hover:from-sky-700 hover:to-teal-700 transition-all duration-300 flex items-center justify-center gap-2"
                        >
                            <span id="loginBtnText">Sign In to Dashboard</span>
                            <svg id="loginSpinner" class="hidden animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </button>
                    </form>

                    <!-- Footer -->
                    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                        <p class="text-xs text-slate-400">
                            Protected admin area • 
                            <a href="citizen.html" class="text-sky-600 hover:text-sky-700 transition">Citizen Panel →</a>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Security notice -->
            <div class="mt-6 text-center animate-in-delay">
                <div class="inline-flex items-center gap-2 text-xs text-slate-400">
                    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                    Secured with Firebase Authentication
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAAcJtQ-rr-7FRLOjipC1XNsHgODLCvs00",
            authDomain: "smart-city-ada8d.firebaseapp.com",
            projectId: "smart-city-ada8d",
            messagingSenderId: "198348279885",
            appId: "1:198348279885:web:cb24e8196a3f7bc05ecc04",
            measurementId: "G-144YHLM2GJ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // If already logged in, redirect to dashboard
        auth.onAuthStateChanged(user => {
            if (user && !user.isAnonymous) {
                window.location.href = 'admin.html';
            }
        });

        // Toggle password visibility
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
        });

        // Login form submission
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginSpinner = document.getElementById('loginSpinner');
        const loginError = document.getElementById('loginError');
        const loginErrorText = document.getElementById('loginErrorText');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Show loading state
            loginBtn.disabled = true;
            loginBtnText.textContent = 'Signing in...';
            loginSpinner.classList.remove('hidden');
            loginError.classList.add('hidden');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // onAuthStateChanged will redirect to admin.html
            } catch (error) {
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In to Dashboard';
                loginSpinner.classList.add('hidden');

                // User-friendly error messages
                const errorMessages = {
                    'auth/user-not-found': 'No admin account found with this email.',
                    'auth/wrong-password': 'Incorrect password. Please try again.',
                    'auth/invalid-email': 'Please enter a valid email address.',
                    'auth/too-many-requests': 'Too many failed attempts. Please wait a moment.',
                    'auth/invalid-credential': 'Invalid email or password. Please try again.',
                    'auth/network-request-failed': 'Network error. Check your internet connection.',
                };

                loginErrorText.textContent = errorMessages[error.code] || `Login failed: ${error.message}`;
                loginError.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
